name = "social-media-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Short-lived conversation state only (10-minute TTL). No media is ever stored.
# Create with:  npx wrangler kv namespace create STATE
# then paste the printed id below.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Comma-separated Telegram user ids allowed to use the bot. Empty = anyone.
ALLOWED_USER_IDS = ""
# Default watermark text. Empty = the bot's @username.
DEFAULT_WATERMARK = ""
# Frames action: how many seconds (max 60) to extract at 1 frame/second.
FRAMES_MAX_SECONDS = "60"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, GITHUB_TOKEN, GITHUB_REPO
