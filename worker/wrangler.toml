name = "mediaflow-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Short-lived state only (every key has a TTL: menus 30 min, job lock 15 min). No media is ever stored.
# Create with:  npx wrangler kv namespace create STATE
# then paste the printed id below.
[[kv_namespaces]]
binding = "STATE"
id = "1dfca3c0ad7c4edfb5326c546070392d"

# Usage database (D1, free plan): users, jobs, events. No media, no credentials.
# Schema: migrations/  ·  apply with: npx wrangler d1 migrations apply mediaflow-db --remote
[[d1_databases]]
binding = "DB"
database_name = "mediaflow-db"
database_id = "5643e847-c28a-4d8b-a792-2adf780dd0b4"
migrations_dir = "migrations"

[vars]
# Comma-separated Telegram user ids allowed to use the bot. Empty = anyone.
ALLOWED_USER_IDS = ""
# Default watermark text. Empty = the bot's @username.
DEFAULT_WATERMARK = ""
# Frames action: how many seconds (max 60) to extract at 1 frame/second.
FRAMES_MAX_SECONDS = "60"
# Per-user cooldown after a job starts (seconds). Plus max 1 active job per user.
COOLDOWN_SECONDS = "20"
# Comma-separated Telegram user ids allowed to use /stats, /users and /recent.
ADMIN_USER_IDS = "8604335127"
# Timezone offset (minutes from UTC) used by admin reports for "today" and times. 360 = Dhaka.
TZ_OFFSET_MINUTES = "360"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, GITHUB_TOKEN, GITHUB_REPO
