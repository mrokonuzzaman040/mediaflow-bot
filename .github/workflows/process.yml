name: Process media

# Triggered only by the Cloudflare Worker through the GitHub API (repository_dispatch).
# The job payload (link, chat id) is read from the event file by the script and masked,
# so it never appears in the (public) logs. The run name shows only the action.
run-name: "process ${{ github.event.client_payload.action }}"

on:
  repository_dispatch:
    types: [process-media]

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp needs a JavaScript runtime for full YouTube support.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core > /dev/null
          ffmpeg -version | head -n 1

      - name: Install latest yt-dlp
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade -r scripts/requirements.txt
          yt-dlp --version

      - name: Download, process and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YT_DLP_COOKIES: ${{ secrets.YT_DLP_COOKIES }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/process.py --github

      - name: Delete all working files
        if: always()
        run: rm -rf "$RUNNER_TEMP"/job_* || true
